name: Wishbird Experiences
description: Wishbird Experiences is Mexico's largest online marketplace for gift experiences, offering
  more than 450 original activities across the country, from adrenaline adventures like skydiving and
  bungee jumping to spa treatments, gourmet dining, hot-air-balloon and helicopter flights, and weekend
  getaways. Experiences are sold as gift cards (Wishcards and Wishbox products) redeemable within a
  twelve-month window, with checkout via credit card, PayPal, and Mercado Pago. The company was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network. It is a direct-to-consumer
  e-commerce business and does not currently publish a public developer API, developer portal, or API
  documentation.
